# AGREGAR dentro del bloque "server { ... listen 443 ssl; ... }" de
# /etc/nginx/sites-enabled/concretosestampados.com  (NO aplicado todavía).
# Lo estático lo sigue sirviendo nginx desde /var/www/concretosestampados.com/current.

    location /api/ {
        proxy_pass http://127.0.0.1:3071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # sobrescribe lo que mande el cliente
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 10m;                          # subida de fotos desde el admin
    }
    location /uploads/ {
        alias /var/lib/bootik/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /admin/index.html;
    }
